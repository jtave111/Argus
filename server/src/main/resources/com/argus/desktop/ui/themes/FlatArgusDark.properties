# Tema escuro "Argus" — quase preto, estilo console C2 / DBeaver Dark.
# @background cascateia para as cores derivadas do FlatLaf; as chaves explícitas
# garantem superfícies bem escuras nos componentes principais.

@background = #15181c
@foreground = #cbd2d9
@accentColor = #4a88c7
@selectionBackground = #24507f
@selectionForeground = #ffffff

# Superfícies gerais (painéis / tool windows)
Panel.background = #15181c
OptionPane.background = #15181c
SplitPane.background = #15181c
TabbedPane.background = #15181c
TabbedPane.contentAreaColor = #15181c
Viewport.background = #15181c
ScrollPane.background = #15181c

# Áreas de "conteúdo" um pouco mais escuras (editor/console)
Table.background = #101317
Tree.background = #101317
List.background = #101317
TextField.background = #0d0f12
TextArea.background = #0d0f12
FormattedTextField.background = #0d0f12
PasswordField.background = #0d0f12
EditorPane.background = #0d0f12
TextPane.background = #0d0f12
ComboBox.background = #1a1e23
Spinner.background = #1a1e23

# Faixas / cabeçalhos
MenuBar.background = #1a1e23
ToolBar.background = #1a1e23
TableHeader.background = #1a1e23
Table.alternateRowColor = #181c21

# Bordas e grades — discretas
Component.borderColor = #2a2f36
Separator.foreground = #2a2f36
Table.gridColor = #23282e

# Seleção na árvore/tabela/lista
Tree.selectionBackground = #24507f
List.selectionBackground = #24507f
Table.selectionBackground = #24507f
