# Tema "ZombieKeeper" — paleta idêntica ao ZombieKeeper-Client (globals.css).
# DBeaver-dark com accent VERMELHO. Cores exatas do projeto de referência.

@background = #1e1e1e
@foreground = #d4d4d4
@accentColor = #cc4444
@selectionBackground = #3a1820
@selectionForeground = #e05c6e

# Superfícies (panel / panel2 / inset)
Panel.background = #252526
OptionPane.background = #252526
SplitPane.background = #1e1e1e
TabbedPane.background = #252526
TabbedPane.contentAreaColor = #1e1e1e
Viewport.background = #1e1e1e
ScrollPane.background = #1e1e1e
MenuBar.background = #252526
ToolBar.background = #252526

# Áreas de conteúdo / inputs (inset)
Table.background = #252526
Tree.background = #252526
List.background = #252526
TextField.background = #181818
TextArea.background = #181818
FormattedTextField.background = #181818
PasswordField.background = #181818
EditorPane.background = #1c1c1c
TextPane.background = #1c1c1c
ComboBox.background = #181818
Spinner.background = #181818
TableHeader.background = #2d2d2d
Table.alternateRowColor = #212121

# Bordas
Component.borderColor = #3d3d3d
Component.focusColor = #cc4444
Separator.foreground = #333333
Table.gridColor = #333333

# Seleção (vermelho do ZombieKeeper)
Tree.selectionBackground = #3a1820
Tree.selectionForeground = #e05c6e
List.selectionBackground = #3a1820
List.selectionForeground = #e05c6e
Table.selectionBackground = #3a1820
Table.selectionForeground = #e05c6e

# Botão default / componentes com accent
Button.default.background = #3a1820
Button.default.foreground = #e05c6e
Button.default.borderColor = #cc4444
ProgressBar.foreground = #cc4444
